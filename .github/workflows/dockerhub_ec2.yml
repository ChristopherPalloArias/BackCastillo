name: Depliegue en EC2

on:
  push:
    branches: ["master"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t christopherpallo2000/castillo-app:latest .

      - name: Push Docker Image
        run: |
          echo "Pushing Docker image to Docker Hub..."
          docker push christopherpallo2000/castillo-app:latest

  deploy-to-ec2:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key for EC2 access
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: SSH into EC2 and deploy container
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_DNS }} << 'EOF'
            # Instalar Docker si no existe
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Descargar la imagen nueva
            sudo docker pull christopherpallo2000/castillo-app:latest

            # Detener y eliminar contenedor anterior si existe
            sudo docker stop castillo-app || true
            sudo docker rm castillo-app || true

            # Crear archivo .env con las variables de entorno
            echo "DB_IP=${{ secrets.DB_IP }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "SECRET_KEY_JWT=${{ secrets.SECRET_KEY_JWT }}" >> .env

            # Lanzar el contenedor
            sudo docker run -d --name castillo-app \
              --env-file .env \
              -p 8081:8081 \
              christopherpallo2000/castillo-app:latest
          EOF
